<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><title>計量管理システム 数字ID QR安定版</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f1117}iframe{border:0;width:100%;height:100%;display:block}</style></head>
<body><iframe id="app" src="truck-scale-system-own-qr.html" allow="camera; autoplay"></iframe><script>
const KEY='truckScaleOwnQrV1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{masters:[],entries:[]}}catch(e){return{masters:[],entries:[]}}}
function save(d){localStorage.setItem(KEY,JSON.stringify(d))}
function ensureIds(){const d=load();d.masters=d.masters||[];let used=new Set(d.masters.map(m=>m.id).filter(Boolean)),n=1;d.masters.forEach(m=>{if(!m.id){while(used.has(String(n).padStart(6,'0')))n++;m.id=String(n).padStart(6,'0');used.add(m.id);n++}});save(d);return d}
ensureIds();const frame=document.getElementById('app');
frame.addEventListener('load',()=>{const w=frame.contentWindow,d=frame.contentDocument;ensureIds();let busy=false;
w.showQR=function(i){const db=ensureIds(),m=db.masters[i];if(!m)return;const qr=w.qrcode(0,'M');qr.addData('TRUCK:'+m.id,'Byte');qr.make();w.currentQRHtml=qr.createSvgTag(7,10);d.getElementById('qr-info').textContent=`${m.vendor}（${m.plate}） ID:${m.id}`;d.getElementById('qr-code').innerHTML=w.currentQRHtml;d.getElementById('qr-modal').classList.add('show')};
w.applyOwnQR=function(raw){const hit=/^TRUCK:(\d{6})$/.exec(String(raw).trim());if(!hit){w.showMsg('scan-msg','旧QRです。数字ID版の新しいQRを使用してください','ng');return}const m=ensureIds().masters.find(x=>x.id===hit[1]);if(!m){w.showMsg('scan-msg','このIDの車両は登録されていません','ng');return}d.getElementById('entry-plate').value=m.plate;d.getElementById('entry-vendor').value=m.vendor;d.getElementById('entry-item').value=m.item;w.showMsg('scan-msg',`読取成功：${m.vendor}（${m.plate}）`)};
w.scanFrame=async function(){if(busy)return;const v=d.getElementById('video'),c=d.getElementById('canvas');if(!v||!c||v.readyState<2||!v.videoWidth)return;busy=true;try{const s=Math.min(1,960/v.videoWidth);c.width=Math.max(320,Math.round(v.videoWidth*s));c.height=Math.max(240,Math.round(v.videoHeight*s));const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,c.width,c.height);let raw='';if('BarcodeDetector'in w){try{const det=new w.BarcodeDetector({formats:['qr_code']}),codes=await det.detect(c);if(codes.length)raw=codes[0].rawValue||''}catch(e){}}if(!raw&&w.jsQR){const im=x.getImageData(0,0,c.width,c.height),code=w.jsQR(im.data,im.width,im.height,{inversionAttempts:'attemptBoth'});if(code)raw=code.data}if(raw){w.stopScan();w.applyOwnQR(raw)}}finally{busy=false}};
const oldSave=w.saveMaster;w.saveMaster=function(){oldSave.apply(this,arguments);ensureIds()};
});</script></body></html>
